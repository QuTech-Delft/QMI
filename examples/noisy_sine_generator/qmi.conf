{
    "log_dir": "${qmi_home}/log",
    "logging": {
        "console_loglevel": "DEBUG"
    },
    "process_management": {
        "output_dir": "${qmi_home}/log"
    },
    "contexts": {
        "nsg_server": {
            "host": "localhost",
            "tcp_server_port" : 40000,
            "connect_to_peers": []
        },
        "nsg_service": {
            "host": "localhost",
            "tcp_server_port": 40001,
            "connect_to_peers": [],
            "enabled": true,
            "program_module": "examples.noisy_sine_generator.noisy_sine_generator_service",
            "program_args": ["--config='{config_dir}/qmi.conf'"]
        },
        "nsg_client": {
            "tcp_server_port": null,
            "connect_to_peers" : [ "nsg_server", "nsg_service"]
        }
    }
}
