name: Python CI Reusable Workflow

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      ref:
        required: false
        type: string

env:
  COVERAGE_MIN_PERC: "90"
  COMPLEXITY_MAX_SCORE: "30"
  SOURCE_DIRS: "qmi/"
  BADGES_DIR: ".github/badges"

jobs:
  ci-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -y bc
          pip install --upgrade pip
          pip install '.[dev]'

      - name: Run ruff
        run: |
          ruff check --output-file "ruff-results-${{ inputs.python-version }}.log" --output-format pylint --exit-zero
      - name: Upload ruff results
        uses: actions/upload-artifact@v7
        with:
          name: ruff-results-${{ inputs.python-version }}
          path: ruff-results-${{ inputs.python-version }}.log

      - name: Run mypy
        run: |
          mypy --namespace-packages $SOURCE_DIRS | tee mypy-${{ inputs.python-version }}.log
          if [ -n "$(tail -n 1 mypy-${{ inputs.python-version }}.log | grep -e '^Succes')" ]; \
            then RESULT="pass"; else RESULT="fail"; fi
          echo "Mypy result: $RESULT"
          exit $([[ "$RESULT" == "pass" ]] && echo 0 || echo 1)
      - name: Upload mypy results
        uses: actions/upload-artifact@v7
        with:
          name: mypy-results-${{ inputs.python-version }}
          path: mypy-${{ inputs.python-version }}.log

      - name: Run coverage
        timeout-minutes: 15
        run: |
          # First, run tests WITHOUT coverage to see if they hang
          timeout 120 python -m unittest tests.core.test_rpc.TestRPC.test_blocking_rpc -v 2>&1 || true
          batch=0
          for dir in "."; do
            subdirs=$(find "tests/$dir" -mindepth 1 -maxdepth 1 -type d ! -name "__pycache__" ! -name "data")
            if [ -n "$subdirs" ]; then
              for subdir in $subdirs; do
                echo "Running coverage for tests in $subdir"
                coverage run --branch --data-file=".coverage.$batch" -m unittest discover --start-directory="$subdir" --pattern="test_*.py"
                batch=$((batch + 1))
              done
            else
              echo "Running coverage for tests in tests/$dir"
              coverage run --branch --data-file=".coverage.$batch" -m unittest discover --start-directory=tests/"$dir" --pattern="test_*.py"
              batch=$((batch + 1))
            fi
          done
          coverage combine
          coverage report --show-missing --fail-under=$COVERAGE_MIN_PERC | tee coverage-${{ inputs.python-version }}.log
          COVERAGE_PERC=$(grep "TOTAL" coverage-${{ inputs.python-version }}.log | grep -Eo '[0-9.]+%' | sed 's/%//')
          echo "Coverage: $COVERAGE_PERC%"
          exit $(echo "$COVERAGE_PERC < $COVERAGE_MIN_PERC" | bc)
      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results-${{ inputs.python-version }}
          path: coverage-${{ inputs.python-version }}.log
