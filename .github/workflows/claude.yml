name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # If you authenticate with a Claude subscription instead of an API
          # key, comment out the line above and use this one instead:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Three ways to "pick up" an issue:
          #  1. Comment "@claude do this" on an issue or PR
          #  2. Assign the issue to the "claude" GitHub user
          #  3. Apply the "claude" label to an issue
          trigger_phrase: "@claude"
          assignee_trigger: "claude"
          label_trigger: "claude"

          # Branch naming for the PRs Claude opens
          branch_prefix: "claude/"

          # Keep runs bounded (cost + time control)
          claude_args: |
            --max-turns 30
            --model claude-sonnet-5
            --append-system-prompt "Follow this repository's CLAUDE.md exactly: use the exact test, lint, and mypy commands listed there (not your own defaults), update CHANGELOG.md, request heevasti as reviewer, and never merge the PR yourself."
