name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # Explicit upper bound for one bot run.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6   # Use the current major version; installs uv for the CLAUDE.md commands.

      - uses: anthropics/claude-code-action@v1
        env:
          BASH_DEFAULT_TIMEOUT_MS: "900000"    # 15 min per command by default, so a full test run fits.
          BASH_MAX_TIMEOUT_MS: "1800000"       # Up to 30 min when requested, e.g. for "gh run watch".
        with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # If you authenticate with a Claude subscription instead of an API
          # key, comment out the line above and use this one instead:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Three ways to "pick up" an issue:
          #  1. Comment "@claude do this" on an issue or PR
          #  2. Assign the issue to the "claude" GitHub user
          #  3. Apply the "claude" label to an issue
          trigger_phrase: "@claude"
          assignee_trigger: "claude"
          label_trigger: "claude"

          # Branch naming for the PRs Claude opens
          branch_prefix: "claude/"

          # Keep runs bounded (cost + time control)
          claude_args: |
            --max-turns 100
            --model claude-sonnet-5
            --allowedTools "Bash(uv sync:*),Bash(uv run:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git fetch:*),Bash(git merge:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr checks:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh run watch:*)"
            --append-system-prompt "Follow this repository's CLAUDE.md exactly: use the exact test, lint, and mypy commands listed there (not your own defaults), update CHANGELOG.md, request heevasti as reviewer, and never merge the PR yourself. Push the branch after every commit, before running tests or waiting for CI."
